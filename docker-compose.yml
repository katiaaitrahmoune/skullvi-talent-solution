services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skullvi
      POSTGRES_PASSWORD: skullvi
      POSTGRES_DB: talent_engine
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skullvi -d talent_engine"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
